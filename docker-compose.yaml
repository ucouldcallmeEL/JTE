services:
  jenkins:
      build: .
      restart: unless-stopped   # Jenkins "restart" exits the JVM; this brings the container back
      user: root
      ports:
        - 50000:50000
        - 8080:8080
      volumes:
        - jenkins_home:/var/jenkins_home
        - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home: